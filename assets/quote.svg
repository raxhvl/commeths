.A{animation:A 4.0s infinite steps(1,end)} .B{animation:B 4.0s infinite steps(1,end)}
.cy{animation:cy 4.0s infinite steps(1,end)} .mg{animation:mg 4.0s infinite steps(1,end)} .tail{animation:tail 4.0s infinite steps(1,end)}
