<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="The fork is always six months away. Commeths are not. Mike Tython, probably."><style>.l{font:400 27px Geist,'Helvetica Neue',Arial,sans-serif;fill:#a6a9ad;letter-spacing:-.01em} .w{font:600 40px 'IBM Plex Mono',SFMono-Regular,Menlo,monospace;fill:#f2f2f2}
