@media (prefers-reduced-motion:reduce){.A,.cy,.mg,.tail{animation:none!important}.A{opacity:0}.tail{transform:none}.B{animation:none!important;opacity:1}}</style><rect width="760" height="230" fill="#050505"/><path d="M10,24 V10 H24 M736,220 H750 V206" fill="none" stroke="#3fd6c6" stroke-width="2"/><text class="m" x="52" y="38">&gt; ETHEREUM PROTOCOL CONTRIBUTIONS</text><text class="l" x="52" y="84">“The fork ith alwayth thix monthth away.</text><g class="A"><g aria-hidden="true"><text class="w cy" x="50" y="146" textLength="168.0" style="fill:#7aa2f7">commits</text><text class="w mg" x="54" y="146" textLength="168.0" style="fill:#d78ac6">commits</text></g><text class="w" x="52" y="146" textLength="168.0">commits</text></g><g class="B"><g aria-hidden="true"><text class="w cy" x="50" y="146" textLength="192.0" style="fill:#7aa2f7">commeths</text><text class="w mg" x="54" y="146" textLength="192.0" style="fill:#d78ac6">commeths</text></g><text class="w" x="52" y="146" textLength="192.0">comm<tspan style="fill:#3fd6c6">eth</tspan>s</text></g><text class="l tail" x="256.0" y="146">are not.”</text><text class="a" x="364.0" y="184">— MIKE TYTHON, PROBABLY</text><g aria-hidden="true"><rect x="610" y="40" width="100" height="100" fill="none" stroke="#222222"/><rect x="626" y="56" width="68" height="68" fill="none" stroke="#3a3d41"/><mask id="ethcut" maskUnits="userSpaceOnUse" x="634" y="64" width="52" height="52"><rect x="634" y="64" width="52" height="52" fill="#fff"/><polyline points="660.00,68.45 645.88,90.63 660.00,98.70 674.12,90.63 660.00,68.45" fill="none" stroke="#000" stroke-width="1.25" stroke-linejoin="round"/><polyline points="660.00,68.45 660.00,98.70" fill="none" stroke="#000" stroke-width="1.25" stroke-linejoin="round"/><polyline points="645.88,90.63 660.00,84.36 674.12,90.63" fill="none" stroke="#000" stroke-width="1.25" stroke-linejoin="round"/><polyline points="645.88,92.79 660.00,100.93 674.12,92.79 660.00,111.55 645.88,92.79" fill="none" stroke="#000" st